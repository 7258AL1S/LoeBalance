name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (for example 0.3.0). Builds artifacts without publishing.'
        required: true
        default: '0.3.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  macos:
    name: macOS packages
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          newest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          swift --version

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package macOS app (x86_64 and arm64)
        run: bash script/package_release.sh "${{ steps.version.outputs.value }}"

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            outputs/LoeBalance-macOS-*.zip
            outputs/LoeBalance-macOS-*.sha256
          if-no-files-found: error

  windows:
    name: Reuse Windows 0.2.0 installers
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows 0.2.0 installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist/windows
          gh release download v0.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'LoeBalance-Setup-0.2.0-win-*' \
            --dir dist/windows

      - name: Upload unchanged Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/windows/LoeBalance-Setup-0.2.0-win-*.exe
            dist/windows/LoeBalance-Setup-0.2.0-win-*.exe.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    # Tag pushes publish; manual runs only build the artifacts.
    if: github.event_name == 'push'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Show collected assets
        run: ls -l dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="LoeBalance ${VERSION}"
          NOTES="docs/releases/${VERSION}.md"

          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" dist/* --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "v${VERSION}" --title "$NAME" --notes-file "$NOTES" dist/*
          else
            gh release create "v${VERSION}" --title "$NAME" --generate-notes dist/*
          fi
